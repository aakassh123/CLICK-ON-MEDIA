<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="600" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A1F6B"/>
      <stop offset="60%" stop-color="#05103B"/>
      <stop offset="100%" stop-color="#02071A"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00C8FF"/>
      <stop offset="100%" stop-color="#0B5CFF"/>
    </linearGradient>
    <linearGradient id="orange-glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFB400"/>
      <stop offset="100%" stop-color="#FF7A00"/>
    </linearGradient>
    <linearGradient id="line-grad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#00C8FF" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#00C8FF"/>
      <stop offset="100%" stop-color="#FF7A00"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="380" rx="24" fill="url(#bg)"/>
  
  <!-- Subtle Isometric Grid -->
  <g opacity="0.12" stroke="#00C8FF" stroke-width="1">
    <path d="M0 60 H600 M0 120 H600 M0 180 H600 M0 240 H600 M0 300 H600"/>
    <path d="M60 0 V380 M120 0 V380 M180 0 V380 M240 0 V380 M300 0 V380 M360 0 V380 M420 0 V380 M480 0 V380 M540 0 V380"/>
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="180" r="100" fill="#00C8FF" opacity="0.15" filter="url(#glow)"/>
  <circle cx="450" cy="120" r="110" fill="#FF7A00" opacity="0.15" filter="url(#glow)"/>

  <!-- Google Search Bar Glass Mockup -->
  <g transform="translate(60, 45)">
    <rect width="480" height="52" rx="26" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    <circle cx="34" cy="26" r="9" stroke="#00C8FF" stroke-width="2.5" fill="none"/>
    <path d="M41 33 L49 41" stroke="#00C8FF" stroke-width="2.5" stroke-linecap="round"/>
    <text x="60" y="32" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" letter-spacing="0.5">Top Digital Growth Agency India</text>
    <rect x="360" y="12" width="105" height="28" rx="14" fill="url(#orange-glow)"/>
    <text x="412" y="30" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle">RANK #1</text>
  </g>

  <!-- Ranking Position #1 Trophy Island -->
  <g transform="translate(60, 125)">
    <rect width="210" height="195" rx="18" fill="rgba(255,255,255,0.05)" stroke="rgba(0,200,255,0.3)" stroke-width="1.5"/>
    
    <!-- Rank 1 Badge -->
    <rect x="20" y="20" width="60" height="26" rx="8" fill="url(#orange-glow)"/>
    <text x="50" y="37" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="900" text-anchor="middle">#1 SPOT</text>
    
    <!-- Big Stat -->
    <text x="20" y="85" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900">+480%</text>
    <text x="20" y="108" fill="#00C8FF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">ORGANIC TRAFFIC</text>
    
    <!-- Checklist -->
    <g transform="translate(20, 130)" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">
      <circle cx="6" cy="6" r="5" fill="#10B981"/>
      <text x="18" y="10">Google Map 3-Pack</text>
      <circle cx="6" cy="28" r="5" fill="#10B981"/>
      <text x="18" y="32">Sub-0.6s Core Vitals</text>
      <circle cx="6" cy="50" r="5" fill="#10B981"/>
      <text x="18" y="54">High-Intent Keywords</text>
    </g>
  </g>

  <!-- Exponential Growth Curve Analytics Chart -->
  <g transform="translate(290, 125)">
    <rect width="250" height="195" rx="18" fill="rgba(255,255,255,0.05)" stroke="rgba(255,122,0,0.3)" stroke-width="1.5"/>
    
    <text x="20" y="32" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="700">GOOGLE SEARCH VISIBILITY</text>
    <text x="20" y="48" fill="#FFB400" font-family="system-ui, sans-serif" font-size="10" font-weight="600">COMPOUNDING INBOUND CALLS</text>

    <!-- Chart Grid Lines -->
    <path d="M25 80 H225 M25 115 H225 M25 150 H225" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    
    <!-- Area Under Curve -->
    <path d="M25 160 Q 90 150, 140 110 T 225 65 L 225 175 L 25 175 Z" fill="url(#cyan-glow)" opacity="0.2"/>
    
    <!-- Dynamic Glowing Curve Line -->
    <path d="M25 160 Q 90 150, 140 110 T 225 65" stroke="url(#line-grad)" stroke-width="3.5" fill="none" stroke-linecap="round" filter="url(#glow)"/>
    
    <!-- Peak Node Dot -->
    <circle cx="225" cy="65" r="6" fill="#FF7A00" stroke="#FFFFFF" stroke-width="2"/>
    <rect x="175" y="40" width="55" height="18" rx="6" fill="#FF7A00"/>
    <text x="202" y="53" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10" font-weight="800" text-anchor="middle">TOP 1%</text>
  </g>
</svg>

